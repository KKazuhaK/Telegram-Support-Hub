services:
  backend-api:
    image: ${APP_IMAGE:-ghcr.io/kkazuhak/telegram-support-hub:latest}
    env_file:
      - .env
    command: uvicorn backend.app.main:app --host 0.0.0.0 --port 8000
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - ./data:/app/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  worker-send:
    image: ${APP_IMAGE:-ghcr.io/kkazuhak/telegram-support-hub:latest}
    env_file:
      - .env
    command: celery -A backend.app.workers.celery_app worker -Q send -n send@%h --loglevel=INFO
    volumes:
      - ./data:/app/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  worker-account:
    image: ${APP_IMAGE:-ghcr.io/kkazuhak/telegram-support-hub:latest}
    env_file:
      - .env
    command: celery -A backend.app.workers.celery_app worker -Q account -n account@%h --loglevel=INFO
    volumes:
      - ./data:/app/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  worker-beat:
    image: ${APP_IMAGE:-ghcr.io/kkazuhak/telegram-support-hub:latest}
    env_file:
      - .env
    command: celery -A backend.app.workers.celery_app beat --loglevel=INFO
    volumes:
      - ./data:/app/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
