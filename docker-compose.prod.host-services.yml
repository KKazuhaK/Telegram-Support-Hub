# Use this file when MariaDB 11.4 and Redis 7 are installed on the host
# (e.g. via aaPanel / baota). Set MYSQL_HOST=host.docker.internal and
# REDIS_HOST=host.docker.internal in .env.
# Start: docker compose -f docker-compose.prod.host-services.yml up -d
services:
  backend-api:
    image: ${APP_IMAGE:-ghcr.io/kkazuhak/telegram-support-hub:latest}
    env_file:
      - .env
    # Runs Alembic upgrade/stamp before handing off to uvicorn.
    command: python -m backend.migrate_then_serve
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - ./data:/app/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  worker-send:
    image: ${APP_IMAGE:-ghcr.io/kkazuhak/telegram-support-hub:latest}
    env_file:
      - .env
    command: celery -A backend.app.workers.celery_app worker -Q send -n send@%h --loglevel=INFO
    volumes:
      - ./data:/app/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  worker-account:
    image: ${APP_IMAGE:-ghcr.io/kkazuhak/telegram-support-hub:latest}
    env_file:
      - .env
    command: celery -A backend.app.workers.celery_app worker -Q account -n account@%h --loglevel=INFO
    volumes:
      - ./data:/app/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  worker-listen:
    image: ${APP_IMAGE:-ghcr.io/kkazuhak/telegram-support-hub:latest}
    env_file:
      - .env
    command: python -m backend.app.workers.listen_worker
    volumes:
      - ./data:/app/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  worker-beat:
    image: ${APP_IMAGE:-ghcr.io/kkazuhak/telegram-support-hub:latest}
    env_file:
      - .env
    command: celery -A backend.app.workers.celery_app beat --loglevel=INFO
    volumes:
      - ./data:/app/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  frontend:
    image: ${FRONTEND_IMAGE:-ghcr.io/kkazuhak/telegram-support-hub-frontend:latest}
    depends_on:
      - backend-api
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    restart: unless-stopped
