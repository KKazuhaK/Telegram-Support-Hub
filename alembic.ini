; Alembic config.
;
; The URL is *not* set here -- env.py reads it from backend.app.core.config
; so the same .env that runs the app also drives migrations. Override
; with `-x url=...` if you need to point at a one-off database.

[alembic]
script_location = backend/migrations
prepend_sys_path = .
version_path_separator = os
# Naming convention so autogenerate writes deterministic, human-readable
# revision IDs instead of random 12-hex digits.
file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s

[post_write_hooks]
# Empty -- we don't auto-format generated revisions; reviewers can do that.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
